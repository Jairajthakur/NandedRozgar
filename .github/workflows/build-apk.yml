name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (increment each release)'
        required: false
        default: ''

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate required secrets
        run: |
          MISSING=""
          [ -z "$EXPO_TOKEN" ]           && MISSING="$MISSING EXPO_TOKEN"
          [ -z "$EXPO_PROJECT_ID" ]      && MISSING="$MISSING EXPO_PROJECT_ID"
          [ -z "$GOOGLE_SERVICES_JSON" ] && MISSING="$MISSING GOOGLE_SERVICES_JSON"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing required secrets:$MISSING"
            exit 1
          fi
          echo "✅ All required secrets present."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Write google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8'))" \
            && echo "✅ google-services.json is valid JSON." \
            || { echo "❌ GOOGLE_SERVICES_JSON secret is not valid JSON."; exit 1; }

      - name: Patch google-services.json for preview package
        # This build uses the "preview" EAS profile, which app.config.js maps
        # to applicationId "com.cityplus.app.preview" (a separate app, so it
        # installs alongside your closed-testing build instead of conflicting
        # with it). The google-services Gradle plugin hard-fails if it can't
        # find a client entry for the exact package name being built, so we
        # clone the existing com.cityplus.app client and retarget the clone
        # at the .preview package. This lets the build compile — Google
        # Sign-In won't actually work under this synthetic entry (it isn't a
        # real registered OAuth client), but everything else, including
        # AdMob test ads, works normally.
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
            const base = data.client.find(c => c.client_info.android_client_info.package_name === 'com.cityplus.app');
            if (!base) { console.error('❌ Could not find com.cityplus.app client in google-services.json'); process.exit(1); }
            const clone = JSON.parse(JSON.stringify(base));
            clone.client_info.android_client_info.package_name = 'com.cityplus.app.preview';
            data.client.push(clone);
            fs.writeFileSync('google-services.json', JSON.stringify(data, null, 2));
            console.log('✅ Added com.cityplus.app.preview client entry to google-services.json');
          "

      - name: Build APK
        run: |
          eas build \
            --platform android \
            --profile preview \
            --local \
            --output ./CityPlus.apk \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          NODE_ENV: production
          ANDROID_VERSION_CODE: ${{ inputs.version_code || secrets.ANDROID_VERSION_CODE || github.run_number }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.EXPO_PUBLIC_RAZORPAY_KEY_ID }}

      - name: Verify APK was produced
        run: |
          if [ ! -f ./CityPlus.apk ]; then
            echo "❌ CityPlus.apk not found — build may have silently failed."
            exit 1
          fi
          SIZE=$(du -sh ./CityPlus.apk | cut -f1)
          echo "✅ CityPlus.apk produced — size: $SIZE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityPlus-APK-${{ github.run_number }}
          path: ./CityPlus.apk
          retention-days: 30
